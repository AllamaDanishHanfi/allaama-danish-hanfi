<!DOCTYPE html>
<html lang="ur" dir="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamiq Library & Fatawa</title>
  <style>
    :root {
      --bg: #f5f8f6;
      --surface: #ffffff;
      --surface-soft: #f9fbfa;
      --primary: #0b462b;
      --primary-dark: #062b1a;
      --primary-mid: #14633f;
      --gold: #c59b27;
      --gold-soft: #fdf8e8;
      --text: #1b2822;
      --muted: #5c6f66;
      --border: #d7e3dc;
      --shadow: 0 8px 24px rgba(6, 43, 26, 0.06);
      --shadow-sm: 0 3px 10px rgba(6, 43, 26, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Nastaliq Urdu", "Noto Sans Devanagari", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(197, 155, 39, 0.08), transparent 36%),
        radial-gradient(circle at top left, rgba(11, 70, 43, 0.07), transparent 40%),
        var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Top Bar & Social Buttons */
    .social-bar {
      background: linear-gradient(90deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.9rem;
      border-bottom: 2px solid var(--gold);
    }

    .topbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .gold-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      display: inline-block;
    }

    .social-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .social-btn {
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: var(--gold);
      color: var(--primary-dark);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(180deg, #ffffff 0%, #fcfdfb 100%);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo-box {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e7f3ec, #f9f3e1);
      border: 1.5px solid rgba(197, 155, 39, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: 800;
      color: var(--primary);
      font-size: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .site-title {
      font-size: 1.5rem;
      color: var(--primary);
      font-weight: 800;
      line-height: 1.3;
    }

    .hero-subline {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-subline::before {
      content: "✦";
      color: var(--gold);
      font-size: 0.9rem;
    }

    .site-intro {
      color: var(--text);
      font-size: 0.98rem;
      white-space: pre-line;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-right: 3px solid var(--primary);
      border-radius: 12px;
      padding: 12px 14px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 14px;
      scrollbar-width: thin;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--gold);
      background: var(--gold-soft);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-mid));
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(11, 70, 43, 0.22);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-top-color: var(--gold);
    }

    .badge {
      display: inline-block;
      background: var(--gold-soft);
      color: var(--primary-dark);
      border: 1px solid rgba(197, 155, 39, 0.45);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 999px;
      width: fit-content;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.45;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .body-text {
      font-size: 0.95rem;
      white-space: pre-line;
      color: var(--text);
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: auto;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-mid));
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .link-btn::after {
      content: "↗";
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .empty-msg {
      color: var(--muted);
      background: var(--surface);
      border: 1.5px dashed rgba(197, 155, 39, 0.55);
      padding: 22px;
      border-radius: 14px;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 540px) {
      .hero {
        padding: 16px;
        border-radius: 14px;
      }

      .site-title {
        font-size: 1.28rem;
      }

      .logo-box {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>
<body>

  <div class="social-bar">
    <span class="topbar-brand"><span class="gold-dot"></span> Deeni Ilm &amp; Tahqeeq</span>
    <div class="social-links">
      <a class="social-btn" id="ytLink" href="https://youtube.com" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="social-btn" id="fbLink" href="https://facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="social-btn" id="igLink" href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>

  <div class="container">
    <header class="hero">
      <div class="brand-row">
        <div class="logo-box" id="logoContainer">
          <span id="logoFallback">ILM</span>
          <img id="logoImg" alt="Website Logo" />
        </div>
        <div>
          <h1 class="site-title" id="displaySiteName">Islamiq Kitab Ghar &amp; Darul Ifta</h1>
          <div class="hero-subline" id="displaySubline">Kitaabein, Mazmoon aur Fatawa ka Markaz</div>
        </div>
      </div>
      <p class="site-intro" id="displayIntro">
        Is website par aap motabar kitaabon ke links, ilmi mazameen aur zaroori fatawa aasani se padh aur dekh sakte hain.
      </p>
    </header>

    <nav class="nav-tabs" aria-label="Sections">
      <button class="tab-btn active" data-tab="links-sec">Drive / Telegram Links</button>
      <button class="tab-btn" data-tab="mazmoon-sec">Mazmoon</button>
      <button class="tab-btn" data-tab="fatawa-sec">Fatwa</button>
    </nav>

    <section id="links-sec" class="section active">
      <div id="linksList" class="grid"></div>
    </section>

    <section id="mazmoon-sec" class="section">
      <div id="mazmoonList" class="grid"></div>
    </section>

    <section id="fatawa-sec" class="section">
      <div id="fatawaList" class="grid"></div>
    </section>
  </div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyBVp3e6RFYqiIAgyR0q7BUHqulfRhA6kvg",
      authDomain: "allama-danish-hanfi.firebaseapp.com",
      projectId: "allama-danish-hanfi",
      storageBucket: "allama-danish-hanfi.firebasestorage.app",
      messagingSenderId: "73684319866",
      appId: "1:73684319866:web:7ed6125f1233baaa8945c3",
      measurementId: "G-EZYM0G7118"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    if (typeof window !== "undefined") {
      getAnalytics(app);
    }
    const db = getFirestore(app);
    const siteDocRef = doc(db, "website_data", "main");

    const LOCAL_KEY = "islamic_site_data_v1";

    const defaultData = {
      settings: {
        siteName: "Islamiq Kitab Ghar & Darul Ifta",
        logoUrl: "",
        intro: "Is website par aap motabar kitaabon ke links, ilmi mazameen aur zaroori fatawa aasani se padh aur dekh sakte hain.",
        youtube: "https://youtube.com",
        facebook: "https://facebook.com",
        instagram: "https://instagram.com"
      },
      links: [],
      mazmoon: [],
      fatawa: []
    };

    function normalizeData(rawObj) {
      const p = rawObj && typeof rawObj === "object" ? rawObj : {};
      return {
        settings: { ...defaultData.settings, ...(p.settings || {}) },
        links: Array.isArray(p.links) ? p.links : [],
        mazmoon: Array.isArray(p.mazmoon) ? p.mazmoon : [],
        fatawa: Array.isArray(p.fatawa) ? p.fatawa : []
      };
    }

    let state = normalizeData(defaultData);

    async function loadFromCloudOrLocal() {
      try {
        const snap = await getDoc(siteDocRef);
        if (snap.exists()) {
          state = normalizeData(snap.data());
          localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
          return;
        }
      } catch (err) {
        console.error("Firestore read error:", err);
      }

      try {
        const localRaw = localStorage.getItem(LOCAL_KEY);
        if (localRaw) {
          state = normalizeData(JSON.parse(localRaw));
        }
      } catch {
        state = normalizeData(defaultData);
      }
    }

    function isSafeUrl(url) {
      try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
      } catch {
        return false;
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".section").forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    function renderSettings() {
      const s = state.settings;
      document.title = s.siteName || "Islamiq Website";
      document.getElementById("displaySiteName").textContent = s.siteName;
      document.getElementById("displayIntro").textContent = s.intro;

      const logoImg = document.getElementById("logoImg");
      const logoFallback = document.getElementById("logoFallback");
      if (s.logoUrl && isSafeUrl(s.logoUrl)) {
        logoImg.src = s.logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      } else {
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      if (isSafeUrl(s.youtube)) document.getElementById("ytLink").href = s.youtube;
      if (isSafeUrl(s.facebook)) document.getElementById("fbLink").href = s.facebook;
      if (isSafeUrl(s.instagram)) document.getElementById("igLink").href = s.instagram;
    }

    function renderLinks() {
      const listEl = document.getElementById("linksList");
      if (!state.links.length) {
        listEl.innerHTML = `<div class="empty-msg">Abhi koi Drive ya Telegram link add nahi hua hai.</div>`;
        return;
      }

      listEl.innerHTML = state.links.map((item) => `
        <article class="card">
          <span class="badge">${escapeHtml(item.source)}</span>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
          <a class="link-btn" href="${isSafeUrl(item.url) ? escapeHtml(item.url) : "#"}" target="_blank" rel="noopener noreferrer">
            Link Kholein
          </a>
        </article>
      `).join("");
    }

    function renderMazmoon() {
      const listEl = document.getElementById("mazmoonList");
      if (!state.mazmoon.length) {
        listEl.innerHTML = `<div class="empty-msg">Abhi koi mazmoon publish nahi hua hai.</div>`;
        return;
      }

      listEl.innerHTML = state.mazmoon.map((item) => `
        <article class="card">
          <span class="badge">Mazmoon</span>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
          ${item.author ? `<div class="meta">Az: ${escapeHtml(item.author)}</div>` : ""}
          <p class="body-text">${escapeHtml(item.body)}</p>
        </article>
      `).join("");
    }

    function renderFatawa() {
      const listEl = document.getElementById("fatawaList");
      if (!state.fatawa.length) {
        listEl.innerHTML = `<div class="empty-msg">Abhi koi fatwa add nahi hua hai.</div>`;
        return;
      }

      listEl.innerHTML = state.fatawa.map((item) => `
        <article class="card">
          <span class="badge">${escapeHtml(item.topic)}</span>
          <h3 class="card-title">Sawal: ${escapeHtml(item.question)}</h3>
          <p class="body-text"><strong>Jawab:</strong> ${escapeHtml(item.answer)}</p>
        </article>
      `).join("");
    }

    function renderAll() {
      renderSettings();
      renderLinks();
      renderMazmoon();
      renderFatawa();
    }

    (async () => {
      await loadFromCloudOrLocal();
      renderAll();
    })();
  </script>
</body>
</html>
